name: Reproduce null Engine payload failure
on:
  push:
    branches: [test/engine-null-payload-fields-red]

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Move build output to scratch disk
        run: |
          sudo mkdir -p /mnt/nm-artifacts
          sudo chown "$(id -u):$(id -g)" /mnt/nm-artifacts
          ln -s /mnt/nm-artifacts src/Nethermind/artifacts
      - name: Run null-field regression before the fix
        run: dotnet test --project src/Nethermind/Nethermind.Merge.Plugin.Test/Nethermind.Merge.Plugin.Test.csproj -c release -- --filter "FullyQualifiedName~NewPayloadV3_should_reject_null_or_missing_required_fields"
